function loadSub(){
    const cat=document.getElementById("category").value;
    const sub=document.getElementById("subCategory");
    sub.innerHTML="<option value=''>Select Sub Category</option>";
    if(!cat) return;

    for(let key in data[cat]){
        let opt=document.createElement("option");
        opt.value=key;
        opt.text=key.toUpperCase();
        sub.appendChild(opt);
    }
}

function recommend(){
    start=0;
    show();
}

function recommendMore(){
    start+=5;
    show();
}

function show(){
    const cat=document.getElementById("category").value;
    const sub=document.getElementById("subCategory").value;
    const res=document.getElementById("result");
    res.innerHTML="";

    if(!cat || !sub){
        res.innerHTML="<li>Please select category and sub-category</li>";
        return;
    }

    currentList=data[cat][sub] || [];

    currentList.slice(start,start+5).forEach(item=>{
        let li=document.createElement("li");
        li.innerText=item;
        res.appendChild(li);
    });

    if(start+5>=currentList.length){
        res.innerHTML+="<li>No more recommendations</li>";
    }
}
